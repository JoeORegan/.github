<svg xmlns="http://www.w3.org/2000/svg" width="760" height="140" viewBox="0 0 760 140" role="img" aria-labelledby="logo-title logo-description">
	<title id="logo-title">Joe O'Regan Games</title>
	<desc id="logo-description">A green retro console-style logo that types Joe O'Regan Games one character at a time.</desc>

	<defs>
		<filter id="green-glow" x="-20%" y="-50%" width="140%" height="200%">
			<feGaussianBlur stdDeviation="3" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>

		<clipPath id="typing-clip">
			<rect x="28" y="20" width="0" height="82">
				<animate
					attributeName="width"
					dur="3.4s"
					repeatCount="indefinite"
					calcMode="discrete"
					values="0;41;82;123;164;205;246;287;328;369;410;451;492;533;574;615;656;697"
				/>
			</rect>
		</clipPath>

		<pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
			<rect width="4" height="2" fill="#07140d" opacity="0.18" />
		</pattern>
	</defs>

	<rect width="760" height="140" rx="8" fill="#07140d" />
	<rect x="1" y="1" width="758" height="138" rx="7" fill="none" stroke="#1e6b3a" stroke-width="2" />
	<rect width="760" height="140" rx="8" fill="url(#scanlines)" />

	<g clip-path="url(#typing-clip)" filter="url(#green-glow)">
		<text
			x="28"
			y="88"
			fill="#62ff8c"
			font-family="'Courier New', 'Lucida Console', monospace"
			font-size="48"
			font-weight="700"
			letter-spacing="0"
			textLength="697"
			lengthAdjust="spacingAndGlyphs"
		>Joe O'Regan Games</text>
	</g>

	<rect x="28" y="42" width="4" height="52" fill="#9affb5" filter="url(#green-glow)">
		<animate
			attributeName="x"
			dur="3.4s"
			repeatCount="indefinite"
			calcMode="discrete"
			values="28;69;110;151;192;233;274;315;356;397;438;479;520;561;602;643;684;725"
		/>
		<animate attributeName="opacity" dur="0.7s" repeatCount="indefinite" values="1;1;0;0;1" />
	</rect>
</svg>
